<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Cards Generator</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Inter:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Dancing+Script:wght@400..700&family=Great+Vibes&family=Spectral:ital,wght@0,200..900;1,200..900&family=Cormorant+Infant:ital,wght@0,100..900;1,100..900&family=Waterfall&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container no-print">
        <main>
            <aside class="sidebar">
                <header class="sidebar-header">
                    <h1>Place Cards Generator</h1>
                    <p>Create elegant, print-ready place cards in seconds.</p>
                </header>
                <div class="sidebar-content">
                <details class="control-group" open>
                    <summary><h2>1. Data Source</h2></summary>
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="paste">Paste Text</button>
                        <button class="tab-btn" data-tab="upload">Upload File</button>
                    </div>
                    <div class="tab-content active" id="tab-paste">
                        <textarea id="names-input" placeholder="Enter names, one per line or comma separated..."></textarea>
                    </div>
                    <div class="tab-content" id="tab-upload">
                        <div class="file-upload-wrapper">
                            <input type="file" id="file-input" accept=".txt,.csv">
                            <label for="file-input" class="file-upload-label">
                                <span class="upload-icon">📁</span>
                                <span>Choose a .txt or .csv file</span>
                            </label>
                        </div>
                    </div>
                </details>

                <details class="control-group" open>
                    <summary><h2>2. Typography</h2></summary>
                    <div class="input-row">
                        <div class="input-col">
                            <label for="font-family">Font Family</label>
                            <select id="font-family">
                                <option value="'Spectral', serif">Spectral</option>
                                <option value="'Cormorant Infant', serif" selected>Cormorant Infant</option>
                                <option value="'Waterfall', cursive">Waterfall</option>
                                <option value="'Inter', sans-serif">Inter</option>
                                <option value="'Roboto', sans-serif">Roboto</option>
                                <option value="'Montserrat', sans-serif">Montserrat</option>
                                <option value="'Playfair Display', serif">Playfair Display</option>
                                <option value="'Caveat', cursive">Caveat</option>
                                <option value="'Dancing Script', cursive">Dancing Script</option>
                                <option value="'Great Vibes', cursive">Great Vibes</option>
                            </select>
                        </div>
                        <div class="input-col">
                            <label for="font-color">Color</label>
                            <div class="color-input-wrapper">
                                <input type="color" id="font-color" value="#1a1a1a">
                            </div>
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="input-col">
                            <label for="font-size">Size (pt)</label>
                            <input type="number" id="font-size" value="24" min="8" max="72">
                        </div>
                        <div class="input-col">
                            <label for="font-weight">Weight</label>
                            <select id="font-weight">
                                <option value="300">Light</option>
                                <option value="400" selected>Regular</option>
                                <option value="600">Semi-Bold</option>
                                <option value="700">Bold</option>
                            </select>
                        </div>
                    </div>
                </details>

                <details class="control-group" open>
                    <summary><h2>3. Card Settings</h2></summary>
                    <div class="input-row">
                        <div class="input-col">
                            <label for="sizing-mode">Sizing Mode</label>
                            <select id="sizing-mode">
                                <option value="dimensions">Specific Dimensions</option>
                                <option value="grid">Grid (Rows/Cols)</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-row" id="dimensions-inputs">
                        <div class="input-col">
                            <label for="card-width">Width (mm)</label>
                            <input type="number" id="card-width" value="90">
                        </div>
                        <div class="input-col">
                            <label for="card-height">Height (mm)</label>
                            <input type="number" id="card-height" value="50">
                        </div>
                    </div>
                    <div class="input-row" id="grid-inputs" style="display: none;">
                        <div class="input-col">
                            <label for="grid-cols">Columns</label>
                            <input type="number" id="grid-cols" value="2" min="1">
                        </div>
                        <div class="input-col">
                            <label for="grid-rows">Rows</label>
                            <input type="number" id="grid-rows" value="5" min="1">
                        </div>
                    </div>
                    <div class="input-row mt-2">
                        <div class="input-col">
                            <label for="card-padding">Inside Margin (mm)</label>
                            <input type="number" id="card-padding" value="5" min="0">
                        </div>
                    </div>
                    <div class="input-row mt-3">
                        <div class="input-col">
                            <label for="cut-guides">Cut Guides</label>
                            <select id="cut-guides">
                                <option value="none">None</option>
                                <option value="dashed-light" selected>Light Dashed</option>
                                <option value="dashed">Dashed</option>
                                <option value="solid">Solid</option>
                            </select>
                        </div>
                    </div>
                </details>

                <details class="control-group" open>
                    <summary><h2>4. Page Layout</h2></summary>
                    <div class="input-row">
                        <div class="input-col">
                            <label for="page-size">Page Size</label>
                            <select id="page-size">
                                <option value="A4">A4 (210 x 297 mm)</option>
                                <option value="Letter">US Letter (8.5 x 11 in)</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-row mt-3">
                        <div class="input-col">
                            <label for="margin-size">Margin (mm)</label>
                            <input type="number" id="margin-size" value="10" min="0" max="50">
                        </div>
                    </div>
                    <div class="input-row mt-3">
                        <div class="input-col">
                            <label class="checkbox-label">
                                <input type="checkbox" id="show-margins">
                                <span class="checkbox-custom"></span>
                                Show margins in preview
                            </label>
                        </div>
                    </div>
                </details>
                </div>
                <div class="sidebar-footer">
                    <button class="primary-btn" id="print-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; vertical-align: middle;"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                        Print
                    </button>
                </div>
            </aside>

            <section class="preview-area">
                <div class="preview-header">
                    <h2>Preview</h2>
                    <div class="preview-actions" style="display: flex; align-items: center; gap: 1rem;">
                        <select id="preview-zoom" style="width: auto; padding: 0.25rem 0.5rem; font-size: 0.85rem; border: 1px solid var(--border-color); border-radius: var(--radius); outline: none;">
                            <option value="fit" selected>Fit</option>
                            <option value="0.5">50%</option>
                            <option value="0.75">75%</option>
                            <option value="1">100%</option>
                        </select>
                        <span class="preview-stats" id="preview-stats">0 Cards • 0 Pages</span>
                    </div>
                </div>
                <div class="preview-container" id="preview-container">
                    <!-- Preview pages will be rendered here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Print-only container -->
    <div id="print-container" class="print-only"></div>

    <script src="script.js"></script>
</body>
</html>
